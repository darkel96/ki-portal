<title>KI-Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Gestaltung nach Firmen-CI: warmes Hellgrau als Grund, Tinte fast schwarz, Industrie-Blau als Hauptfarbe,
   Orange als Werkzeugfarbe des Baukastens, Gelb nur für KI-Aktionen. Display-Schrift leicht und eng gesetzt,
   Text in Noto Sans, kleine Rubriken in Noto Sans Mono. Kanten scharf, Buttons als Pille, Listen mit Haarlinien.
   Layout: Startseite = Bereichsverzeichnis links | Kacheln rechts; Baukasten = Palette | Fläche | Eigenschaften. */
:root{
  --bg:#FBFAF9; --surface:#FFFFFF; --surface-2:#F0EEEA; --ink:#00050D; --muted:#5C5A58; --line:#DEDAD4; --line-strong:#BFB8AF;
  --accent:#0060FF; --accent-ink:#FFFFFF; --accent-soft:#E5EFFF; --accent-deep:#001C4C;
  --block:#FE8623; --block-ink:#00050D; --block-soft:#FFF0E2; --block-text:#A64B00;
  --signal:#FFE32F; --signal-ink:#00050D;
  --danger:#C4281C; --danger-soft:#FBE6E3;
  --a0:#0060FF; --a0i:#FFFFFF; --a1:#001C4C; --a1i:#FFFFFF; --a2:#FE8623; --a2i:#00050D; --a3:#FFE32F; --a3i:#00050D;
  --a4:#4C8FFF; --a4i:#00050D; --a5:#5C5A58; --a5i:#FFFFFF; --a6:#FEC037; --a6i:#00050D;
  --grid-dot:#DCD7CF;
  --f-display:"Inter Tight", "Segoe UI", system-ui, sans-serif;
  --f-body:"Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Noto Sans Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F15; --surface:#151A21; --surface-2:#1F252D; --ink:#FBFAF9; --muted:#BFB8AF; --line:#2E353E; --line-strong:#4C5055;
    --accent:#4C8FFF; --accent-ink:#00050D; --accent-soft:#0F2752; --accent-deep:#CCDFFF;
    --block:#FEC037; --block-ink:#00050D; --block-soft:#3A2A10; --block-text:#FEC037;
    --signal:#FFE32F; --signal-ink:#00050D;
    --danger:#FF9A9A; --danger-soft:#3D1A18;
    --a0:#4C8FFF; --a0i:#00050D; --a1:#CCDFFF; --a1i:#00050D; --a2:#FE8623; --a2i:#00050D; --a3:#FFE32F; --a3i:#00050D;
    --a4:#7FB0FF; --a4i:#00050D; --a5:#BFB8AF; --a5i:#00050D; --a6:#FEC037; --a6i:#00050D;
    --grid-dot:#252B33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F15; --surface:#151A21; --surface-2:#1F252D; --ink:#FBFAF9; --muted:#BFB8AF; --line:#2E353E; --line-strong:#4C5055;
  --accent:#4C8FFF; --accent-ink:#00050D; --accent-soft:#0F2752; --accent-deep:#CCDFFF;
  --block:#FEC037; --block-ink:#00050D; --block-soft:#3A2A10; --block-text:#FEC037;
  --signal:#FFE32F; --signal-ink:#00050D;
  --danger:#FF9A9A; --danger-soft:#3D1A18;
  --a0:#4C8FFF; --a0i:#00050D; --a1:#CCDFFF; --a1i:#00050D; --a2:#FE8623; --a2i:#00050D; --a3:#FFE32F; --a3i:#00050D;
  --a4:#7FB0FF; --a4i:#00050D; --a5:#BFB8AF; --a5i:#00050D; --a6:#FEC037; --a6i:#00050D;
  --grid-dot:#252B33;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:24px}
@media (max-width:560px){.wrap{padding-inline:16px}}
main.wide{max-width:1680px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.rubrik{display:flex;align-items:center;gap:12px;font:400 12px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.035em;color:var(--ink)}
.rubrik::after{content:"";width:40px;height:1px;background:var(--line-strong)}
.eyebrow{font:400 12px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.035em;color:var(--muted)}
.grow{flex:1}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:28px;min-height:68px;flex-wrap:wrap;padding-block:8px;max-width:1680px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:400 23px/1 var(--f-display);letter-spacing:-.03em}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--ink);font-size:15px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ai-pill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.ai-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ai-pill[data-s="ready"] i{background:var(--accent)}
.ai-pill[data-s="off"] i{background:var(--block)}
main{padding-block:40px 80px;display:flex;flex-direction:column;gap:28px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;text-decoration:none;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.btn.blockbtn{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.btn.blockbtn:hover{background:color-mix(in srgb,var(--signal) 88%,var(--ink))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{font-size:13px;padding:7px 14px}
.back{background:none;border:0;padding:0;color:var(--ink);font-size:14px;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px}
.back:hover{text-decoration-color:var(--ink)}

/* Einstieg */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:20px 48px;align-items:end}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro h1{font-size:clamp(38px,5.4vw,64px);letter-spacing:-.04em;line-height:1.08;margin-top:14px}
.lede{color:var(--muted);margin:0;max-width:56ch}
.search{display:flex;flex-direction:column;gap:14px;min-width:0}
.search input{border-radius:999px!important;padding:13px 20px!important;font-size:15px}

/* Startseite: Bereichsverzeichnis | Kacheln */
.hub{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.hub{grid-template-columns:1fr;gap:24px}}
.dir{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column}
@media (max-width:900px){.dir{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:20px}}
.dir-head{margin-bottom:10px}
@media (max-width:900px){.dir-head{grid-column:1/-1}}
.chip{display:flex;align-items:center;gap:12px;padding:13px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:400 19px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink);transition:padding .2s}
.chip:last-child{border-bottom:1px solid var(--line)}
@media (max-width:900px){.chip{font-size:16px;padding:10px 2px}.chip:last-child{border-bottom:0}}
.chip i{width:12px;height:12px;background:var(--ac,var(--ink));flex:none}
.chip span{flex:1;min-width:0}
.chip small{font:400 13px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover span{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px}
.chip[aria-pressed="true"]{color:var(--accent);padding-left:10px}
.chip[aria-pressed="true"] small{color:var(--accent)}
.grid-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid-head h2{font-size:30px;letter-spacing:-.03em}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{display:flex;flex-direction:column;gap:12px;text-align:left;padding:22px;border:0;background:var(--surface);min-height:232px;color:var(--ink)}
button.tile:hover{background:var(--bg)}
button.tile:hover .tile-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono{display:inline-grid;place-items:center;width:42px;height:42px;font:500 15px/1 var(--f-display);letter-spacing:0;background:var(--ac);color:var(--aci,#fff);flex:none}
.area{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.area i{width:8px;height:8px;background:var(--ac)}
.tile-name{font:400 22px/1.15 var(--f-display);letter-spacing:-.025em}
.tile-desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{font-size:12px;line-height:1;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.own{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.local{background:var(--block-soft);color:var(--block-text);border-color:transparent}
.badge.code{background:var(--ink);color:var(--bg);border-color:transparent}
.tile-new{background:var(--bg);justify-content:center}
.tile-new:hover{background:var(--surface)!important}
.plus{display:inline-grid;place-items:center;width:42px;height:42px;background:var(--signal);color:var(--signal-ink);font:300 28px/1 var(--f-display)}
.empty-grid{grid-column:1/-1;color:var(--muted);padding:22px;background:var(--surface);margin:0}

/* Formularelemente (Hub) */
input[type="text"],input[type="search"],input[type="number"],input[type="date"],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.check input{accent-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:20px}
.status{font-size:12px;line-height:1;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status[data-s="run"]{background:var(--block-soft);color:var(--block-text)}
.status[data-s="run"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite alternate}
.status[data-s="done"]{background:var(--accent-soft);color:var(--accent)}
.status[data-s="err"]{background:var(--danger-soft);color:var(--danger)}
@keyframes pulse{from{opacity:1}to{opacity:.25}}

/* App-Ansicht im Hub */
.app-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.app-tags{display:flex;gap:6px;flex-wrap:wrap}

/* ===== Gestaltete Applikation (o-*) ===== */
.app-frame{
  --app-muted:color-mix(in srgb,var(--app-ink) 62%,var(--app-bg));
  --app-line:color-mix(in srgb,var(--app-ink) 16%,var(--app-bg));
  --app-soft:color-mix(in srgb,var(--app-ink) 5%,var(--app-bg));
  background:var(--app-bg);color:var(--app-ink);font-family:var(--app-font);
  border-radius:var(--app-radius);border:1px solid var(--app-line);
}
.app-inner{max-width:var(--app-max);margin-inline:auto;padding:28px clamp(16px,4vw,40px) 36px;display:flex;flex-direction:column;gap:14px}
.o-stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.o-h{margin:0;font-family:var(--app-head,var(--app-font));font-weight:400;letter-spacing:-.025em;line-height:1.12;text-wrap:balance}
.o-h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.035em}
.o-h2{font-size:26px}
.o-h3{font-size:19px;font-weight:500}
.o-p{margin:0;max-width:72ch}
.o-p.o-s{font-size:13px}.o-p.o-m{font-size:15px}.o-p.o-l{font-size:18px}
.o-call{padding:12px 14px;border-radius:var(--app-radius);font-size:14px;background:color-mix(in srgb,var(--tone) 13%,var(--app-bg));border:1px solid color-mix(in srgb,var(--tone) 30%,var(--app-bg))}
.o-call b{color:var(--tone);font-weight:600;margin-right:6px}
.o-hr{border:0;border-top:1px solid var(--app-line);margin:4px 0;width:100%}
.o-sec{border-radius:var(--app-radius);display:flex;flex-direction:column;gap:14px;min-width:0}
.o-sec.bordered{border:1px solid var(--app-line)}
.o-sec.p-s{padding:12px}.o-sec.p-m{padding:20px}.o-sec.p-l{padding:32px}
.o-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:760px){.o-cols{grid-template-columns:1fr}}
.o-field{display:flex;flex-direction:column;gap:6px}
.o-field>label,.o-field>.o-lbl{font-size:13px;font-weight:600}
.o-field em{font-style:normal;color:var(--app-accent);margin-left:3px}
.o-help{font-size:12px;color:var(--app-muted)}
.o-field input[type="text"],.o-field input[type="number"],.o-field input[type="date"],.o-field textarea,.o-field select{
  background:var(--app-bg);color:var(--app-ink);border:1px solid var(--app-line);border-radius:calc(var(--app-radius) * .7);font-family:inherit}
.o-field input:focus,.o-field textarea:focus,.o-field select:focus{border-color:var(--app-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--app-accent) 22%,transparent)}
.o-opts{display:flex;flex-wrap:wrap;gap:8px 16px}
.o-opts label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.o-field input[type="checkbox"],.o-field input[type="radio"]{accent-color:var(--app-accent)}
.o-field.err input,.o-field.err textarea,.o-field.err select{border-color:#C0392B}
.o-err{font-size:12px;color:#C0392B}
.o-file{font-size:13px}
.o-btn-row{display:flex}
.o-btn{font-family:inherit;font-weight:500;font-size:15px;padding:12px 24px;border-radius:999px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-ink)}
.o-btn.outline{background:transparent;color:var(--btn)}
.o-btn:hover:not(:disabled){filter:brightness(1.08)}
.o-btn:disabled{opacity:.45;cursor:not-allowed}
.o-btn.running{background:transparent;color:var(--btn)}
.o-out{display:flex;flex-direction:column;gap:10px;min-width:0}
.o-out.card{border:1px solid var(--app-line);border-radius:var(--app-radius);padding:16px 18px;background:var(--app-bg)}
.o-out-head{display:flex;align-items:center;gap:10px}
.o-out-t{font-weight:600;font-size:15px;flex:1;min-width:0}
.o-muted{color:var(--app-muted);font-size:14px;margin:0}
.o-out-body{font-size:15px;overflow-wrap:anywhere;min-width:0}
.o-out-body>:first-child{margin-top:0}.o-out-body>:last-child{margin-bottom:0}
.o-out-body h3,.o-out-body h4,.o-out-body h5{font-size:16px;margin:16px 0 6px}
.o-out-body p{margin:0 0 10px}.o-out-body ul,.o-out-body ol{margin:0 0 10px;padding-left:22px}
.o-out-body code{font-family:var(--f-mono);font-size:13px;background:var(--app-soft);padding:1px 5px;border-radius:4px}
.o-out-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.o-out-foot details{flex-basis:100%}
.o-out-foot summary{cursor:pointer;font-size:13px;color:var(--app-muted)}
.tbl{overflow-x:auto;margin:0 0 12px}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--app-line);vertical-align:top}
.tbl th{font-weight:600;background:var(--app-soft)}
pre.prompt{margin:0;white-space:pre-wrap;font:12.5px/1.5 var(--f-mono);background:var(--app-soft,var(--surface-2));padding:12px;border-radius:8px;overflow-x:auto;color:inherit}
.sim-note{font-size:13px;color:var(--block-text);margin:0 0 8px}
.err-text{color:#C0392B;font-size:14px;margin:0}
.auto-out{display:flex;flex-direction:column;gap:14px}
.auto-out:empty{display:none}

/* ===== Baukasten ===== */
.bld-bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.bar-name{font:700 22px/1.2 var(--f-display)!important;letter-spacing:-.015em;border-color:transparent!important;background:transparent!important;padding:4px 8px!important;width:auto!important;flex:1 1 220px;max-width:420px}
.bar-name:hover{border-color:var(--line)!important}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.save-msg{font-size:13px;color:var(--muted)}
.save-msg.bad{color:var(--danger)}

.bld{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1180px){.bld{grid-template-columns:minmax(0,1fr) 290px}.pal{grid-column:1/-1;position:static!important}.pal-groups{flex-direction:row!important;flex-wrap:wrap}.pal-g{flex:1 1 200px}}
@media (max-width:780px){.bld{grid-template-columns:1fr}}
.pal{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px;padding:14px}
.pal-groups{display:flex;flex-direction:column;gap:14px}
.pal-g{display:flex;flex-direction:column;gap:7px}
.pal-items{display:flex;flex-direction:column;gap:4px}
@media (max-width:1180px){.pal-items{flex-direction:row;flex-wrap:wrap}}
.pal-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:0;border:1px solid transparent;background:transparent;font-size:13.5px;text-align:left;cursor:grab}
.pal-item:hover{background:var(--surface-2);border-color:var(--line)}
.pal-item:active{cursor:grabbing}
.pal-item .g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:0;background:var(--surface-2);font:600 12px/1 var(--f-mono);color:var(--ink);flex:none}
.pal-g[data-g="KI"] .g{background:var(--block-soft);color:var(--block-text)}
.pal-g[data-g="Eingaben"] .g{background:var(--accent-soft);color:var(--accent)}

.stage{background-color:var(--surface-2);background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);background-size:16px 16px;border-radius:0;padding:22px;min-height:520px;border:1px solid var(--line)}
@media (max-width:560px){.stage{padding:10px}}
.ai-box{margin-bottom:16px;display:flex;flex-direction:column;gap:10px;border-color:color-mix(in srgb,var(--block) 45%,var(--line))}
.ai-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-head h3{font-size:17px;font-weight:600}
.ai-head .g{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:0;background:var(--block-soft);color:var(--block-text);font:600 13px/1 var(--f-mono)}

/* ================= Hilfsfunktionen ================= */
const rid = p => p + Math.random().toString(36).slice(2,9);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const escNl = s => esc(s).replace(/\n/g,"<br>");
const clone = o => JSON.parse(JSON.stringify(o));
function slug(s){
  return String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,30) || "feld";
}
function uniqueKey(base, taken){
  let k = base, n = 2;
  while(taken.has(k)) k = base + "_" + (n++);
  return k;
}
function areaIdx(area){
  const i = AREA_ORDER.indexOf(area);
  if(i >= 0) return i;
  let h = 0; for(const c of String(area)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return h % 7;
}
function initials(name){
  const w = String(name).replace(/[^A-Za-zÄÖÜäöüß0-9\s-]/g,"").split(/[\s-]+/).filter(Boolean);
  if(!w.length) return "KI";
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0,2)).toUpperCase();
}
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if(!m) return null;
  const n = parseInt(m[1],16), ch = [n>>16 & 255, n>>8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v/12.92 : ((v+.055)/1.055) ** 2.4; });
  const L = .2126*ch[0] + .7152*ch[1] + .0722*ch[2];
  return L > .38 ? "#14201C" : "#F3F6F5";
}
function walk(list, fn){
  for(const b of list){ fn(b); if(b.children) walk(b.children, fn); if(b.cols) b.cols.forEach(c => walk(c, fn)); }
}
function locate(list, id){
  for(let i = 0; i < list.length; i++){
    const b = list[i];
    if(b.id === id) return {list, i, b};
    const subs = [b.children, ...(b.cols || [])].filter(Boolean);
    for(const s of subs){ const r = locate(s, id); if(r) return r; }
  }
  return null;
}
function fieldsOf(app){ const out = []; walk(app.blocks || [], b => { if(BT[b.type]?.field) out.push(b); }); return out; }
function allKeys(app, except){
  const s = new Set();
  fieldsOf(app).forEach(b => { if(b !== except) s.add(b.props.key); });
  (app.steps || []).forEach(st => { if(st !== except) s.add(st.key); });
  return s;
}
function varsIn(text){ return [...String(text || "").matchAll(/\{\{\s*([^}]+?)\s*\}\}/g)].map(m => m[1].toLowerCase()); }
function renameRefs(app, oldK, newK){
  const re = new RegExp("\\{\\{\\s*" + oldK + "\\s*\\}\\}", "gi");
  app.steps.forEach(s => { s.prompt = s.prompt.replace(re, "{{" + newK + "}}"); s.wissen = (s.wissen || "").replace(re, "{{" + newK + "}}"); if(s.bedingung?.feld === oldK) s.bedingung.feld = newK; });
}
function stepsUsing(app, key){
  const k = String(key).toLowerCase(), out = [];
  (app.steps || []).forEach((s,i) => { if(s.autoAll || varsIn(s.prompt + " " + (s.wissen || "")).includes(k)) out.push(i); });
  return out;
}
function removeVar(s, k){
  const kre = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const tok = new RegExp(`\\{\\{\\s*${kre}\\s*\\}\\}`, "gi");
  s.prompt = s.prompt.replace(new RegExp(`\\n*[^\\n{}]*:[ \\t]*\\n\\{\\{\\s*${kre}\\s*\\}\\}[ \\t]*`, "gi"), "")
    .replace(tok, "").replace(/\n{3,}/g, "\n\n").trim();
  s.wissen = (s.wissen || "").replace(tok, "").trim();
}
function fill(tpl, ctx){
  return String(tpl || "").replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, k) => {
    const key = k.toLowerCase();
    return Object.prototype.hasOwnProperty.call(ctx, key) ? ctx[key] : m;
  });
}

/* Markdown für KI-Antworten */
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
function mdTable(rows){
  const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c => c.trim());
  const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
  if(!body.length) return "";
  const [head, ...rest] = body;
  return `<div class="tbl"><table><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
    rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function md(src){
  const lines = String(src).replace(/\r/g,"").split("\n");
  let html = "", i = 0, m;
  const blockStart = /^(#{1,4}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|\s*(---|\*\*\*)\s*$|\s*```)/;
  while(i < lines.length){
    const l = lines[i];
    if(!l.trim()){ i++; continue; }
    if(/^\s*```/.test(l)){
      const code = []; i++;
      while(i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += `<pre class="prompt">${esc(code.join("\n"))}</pre>`; continue;
    }
    if((m = l.match(/^(#{1,4})\s+(.*)/))){ const h = Math.min(m[1].length + 2, 5); html += `<h${h}>${inline(m[2])}</h${h}>`; i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ const rows = []; while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]); html += mdTable(rows); continue; }
    if(/^\s*[-*•]\s+/.test(l)){ html += "<ul>"; while(i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) html += `<li>${inline(lines[i++].replace(/^\s*[-*•]\s+/,""))}</li>`; html += "</ul>"; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ html += "<ol>"; while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) html += `<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/,""))}</li>`; html += "</ol>"; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ html += "<hr>"; i++; continue; }
    const para = [inline(lines[i++])];
    while(i < lines.length && lines[i].trim() && !blockStart.test(lines[i])) para.push(inline(lines[i++]));
    html += `<p>${para.join("<br>")}</p>`;
  }
  return html;
}
function renderResult(text, format){
  if(format === "json") return `<pre class="prompt">${esc(text)}</pre>`;
  if(format === "text") return `<p>${escNl(text)}</p>`;
  return md(text);
}

/* ================= Datenmodell ================= */
function blk(type, props, extra){ return {id:rid("b"), type, props:{...props}, ...(extra || {})}; }
function makeBlock(type, app){
  const P = {};
  const b = {id:rid("b"), type, props:P};
  switch(type){
    case "section": Object.assign(P, {bg:"", pad:"m", border:true}); b.children = []; break;
    case "columns": P.count = 2; b.cols = [[],[]]; break;
    case "spacer": P.h = 24; break;
    case "divider": break;
    case "heading": Object.assign(P, {text:"Überschrift", level:2, align:"left", color:""}); break;
    case "text": Object.assign(P, {text:"Beschreib hier kurz, was zu tun ist.", size:"m", align:"left", color:""}); break;
    case "callout": Object.assign(P, {text:"Bitte keine personenbezogenen Daten eingeben.", tone:"info"}); break;
    case "image": Object.assign(P, {src:"", alt:"", size:"m", align:"left"}); break;
    case "button": Object.assign(P, {text:"KI starten", aktion:"alle", stil:"filled", color:"", align:"left"}); break;
    case "output": Object.assign(P, {titel:"Ergebnis", quelle:app?.steps?.[0]?.id || "", stil:"card"}); break;
    default:
      if(BT[type]?.field){
        P.label = type === "checkbox" ? "Ja, das trifft zu" : BT[type].label;
        P.key = uniqueKey(slug(P.label), allKeys(app));
        Object.assign(P, {keyAuto:true, pflicht:false, beispiel:"", hilfe:"", placeholder:"", rows:5});
        if(type === "select" || type === "radio") P.optionen = ["Option A","Option B"];
        if(type === "file") P.uebergabe = "text";
      }
  }
  return b;
}
function legacyToApp(d){
  const app = {id:d.id || null, v:2, name:d.name || "Neue Applikation", bereich:d.bereich || "Allgemein", beschreibung:d.beschreibung || "",
    typ:d.typ || "baukasten", url:d.url || "", theme:{...DEFAULT_THEME, accent:d.farbe || ""},
    steps:[], blocks:[], geaendert:d.geaendert || "",
    status:d.status || "freigegeben", owner:d.owner || "", schutz:d.schutz || "intern", version:d.version ?? 1};
  if(app.typ === "link") return app;
  app.steps = (d.schritte || []).map((s,i) => ({id:rid("s"), name:s.titel || "KI-Schritt " + (i+1), key:"schritt" + (i+1),
    rolle:s.rolle || "", wissen:"", prompt:s.prompt || "", modell:s.modell || "default", format:s.format || "markdown"}));
  const typeMap = {text:"input", textarea:"textarea", auswahl:"select"};
  const fields = (d.felder || []).map(f => blk(typeMap[f.typ] || "input", {label:f.label, key:f.key, keyAuto:false, pflicht:!!f.pflicht,
    beispiel:f.beispiel || "", hilfe:"", placeholder:"", rows:5, optionen:f.optionen || []}));
  const left = [blk("section", {bg:"", pad:"m", border:true}, {children:[
    blk("heading", {text:"Eingaben", level:3, align:"left", color:""}), ...fields,
    blk("button", {text:"Ausführen", aktion:"alle", stil:"filled", color:"", align:"left"})
  ]})];
  const right = app.steps.map(s => blk("output", {titel:s.name, quelle:s.id, stil:"card"}));
  app.blocks = [
    blk("heading", {text:app.name, level:1, align:"left", color:""}),
    blk("text", {text:app.beschreibung, size:"m", align:"left", color:""}),
    blk("columns", {count:2}, {cols:[left, right]})
  ];
  return app;
}
function ensureV2(a){
  if(!a || a.typ === "link") return a && a.v === 2 ? a : legacyToApp(a || {});
  if(!a.blocks) return legacyToApp(a);
  const {ki, ...rest} = a;   // frühere App-eigene Schnittstellen-Angaben entfallen, die Anbindung ist zentral
  return {status:"entwurf", owner:"", schutz:"intern", version:1, ...rest, theme:{...DEFAULT_THEME, ...(a.theme || {})}, steps:a.steps || []};
}
function newApp(){
  return legacyToApp({name:"Neue Applikation", bereich:"Allgemein", beschreibung:"Beschreib hier kurz, was die Applikation macht.", status:"entwurf", version:0,
    felder:[{key:"text", label:"Text", typ:"textarea", pflicht:true}],

}

function allApps(){

  const own = [...dbApps.map(a => ({...a, _src:"db"})), ...localApps.filter(a => !dbIds.has(a.id)).map(a => ({...a, _src:"local"}))]
    .sort((a,b) => String(b.geaendert || "").localeCompare(String(a.geaendert || "")));

  db.collection("apps").onSnapshot(snap => {
    dbApps = snap.docs.filter(d => d.exists).map(d => ensureV2({...d.data(), id:d.id}));
    if(view.name === "start") renderStart(true);
  }, () => {});

async function persist(def){
  const {id, ...body} = def;
  if(db){
    try{
      await db.collection("apps").doc(id).set(body);
      const i = dbApps.findIndex(a => a.id === id);
      if(i >= 0) dbApps[i] = def; else dbApps.push(def);
      const li = localApps.findIndex(a => a.id === id);
      if(li >= 0){ localApps.splice(li,1); saveLocal(); }
      return "db";
    }catch{ /* lokal weiter */ }
  }
  const before = localApps.slice();
  const i = localApps.findIndex(a => a.id === id);
  if(i >= 0) localApps[i] = def; else localApps.push(def);
  if(saveLocal()) return "local";
  localApps = before;
  return "none";
}
async function removeApp(app){
  if(app._src === "db" && db){
    try{ await db.collection("apps").doc(app.id).delete(); }catch{}
    dbApps = dbApps.filter(a => a.id !== app.id);
  }
  localApps = localApps.filter(a => a.id !== app.id); saveLocal();
}

/* ================= Applikation darstellen (Bearbeiten und Ausführen) ================= */
function themeStyle(t){
  t = {...DEFAULT_THEME, ...(t || {})};
  let s = `--app-accent:${t.accent || "var(--accent)"};--app-font:${FONTS[t.font] || FONTS.sans};--app-head:${HEADS[t.font] || HEADS.sans};--app-radius:${RADIUS[t.radius] || RADIUS.m};--app-max:${WIDTH[t.width] || WIDTH.m};`;
  const ink = inkFor(t.bg);
  s += t.bg && ink ? `--app-bg:${t.bg};--app-ink:${ink};` : `--app-bg:var(--surface);--app-ink:var(--ink);`;
  const aInk = inkFor(t.accent);
  s += `--app-accent-ink:${aInk || "var(--accent-ink)"};`;
  return s;
}
function appHtml(app, mode){
  reg = new Map();
  return `<div class="app-frame" data-mode="${mode}" style="${themeStyle(app.theme)}"><div class="app-inner">${listHtml(app.blocks, "root", app, mode)}<div class="auto-out"></div></div></div>`;
}
function listHtml(arr, listId, app, mode){
  if(mode === "edit"){
    reg.set(listId, arr);
    return `<div class="b-list" data-list="${listId}">${arr.map(b => blockHtml(b, app, mode)).join("") || `<div class="b-empty">Elemente hierher ziehen</div>`}</div>`;
  }
  return arr.map(b => blockHtml(b, app, mode)).join("");
}
function fieldControl(b, mode){
  const P = b.props, id = "in-" + P.key, dis = mode === "edit" ? "disabled tabindex=\"-1\"" : "";
  const req = P.pflicht ? "<em>*</em>" : "";
  const help = P.hilfe ? `<span class="o-help">${esc(P.hilfe)}</span>` : "";
  let ctl;
  switch(b.type){
    case "textarea": ctl = `<textarea id="${id}" rows="${+P.rows || 5}" placeholder="${esc(P.placeholder)}" ${dis}></textarea>`; break;
    case "select": ctl = `<select id="${id}" ${dis}><option value="">Bitte wählen</option>${(P.optionen || []).map(o => `<option>${esc(o)}</option>`).join("")}</select>`; break;
    case "radio": return `<div class="o-field" data-key="${esc(P.key)}"><span class="o-lbl">${esc(P.label)}${req}</span><div class="o-opts">${(P.optionen || []).map((o,i) => `<label><input type="radio" name="r-${esc(P.key)}" value="${esc(o)}" ${dis}> ${esc(o)}</label>`).join("")}</div>${help}</div>`;
    case "checkbox": return `<div class="o-field" data-key="${esc(P.key)}"><label class="check" style="font-size:14px;font-weight:500"><input id="${id}" type="checkbox" ${dis}> ${esc(P.label)}${req}</label>${help}</div>`;
    case "number": ctl = `<input id="${id}" type="number" placeholder="${esc(P.placeholder)}" ${dis}>`; break;
    case "date": ctl = `<input id="${id}" type="date" ${dis}>`; break;
    case "file": ctl = `<input id="${id}" type="file" class="o-file" accept=".txt,.csv,.md,.json,.xml,.html,.xlsx,.xls,.docx,.pdf,text/*" data-file="${esc(P.key)}" ${dis}><span class="o-help" id="fi-${esc(P.key)}"></span>`; break;
    default: ctl = `<input id="${id}" type="text" placeholder="${esc(P.placeholder)}" ${dis}>`;
  }
  return `<div class="o-field" data-key="${esc(P.key)}"><label for="${id}">${esc(P.label)}${req}</label>${ctl}${help}</div>`;
}
function blockHtml(b, app, mode){
  const P = b.props || {};
  const al = P.align ? `text-align:${P.align};` : "";
  const col = P.color ? `color:${P.color};` : "";
  let inner;
  switch(b.type){
    case "heading": { const l = [1,2,3].includes(+P.level) ? +P.level : 2; inner = `<h${l+1} class="o-h o-h${l}" style="${al}${col}" data-edit>${esc(P.text)}</h${l+1}>`; break; }
    case "text": inner = `<p class="o-p o-${P.size || "m"}" style="${al}${col}${P.align === "center" ? "margin-inline:auto;" : P.align === "right" ? "margin-left:auto;" : ""}" data-edit>${escNl(P.text)}</p>`; break;
    case "callout": { const [lab, tone] = TONES[P.tone] || TONES.info; inner = `<div class="o-call" style="--tone:${tone}"><b>${lab}</b><span data-edit>${escNl(P.text)}</span></div>`; break; }
    case "divider": inner = `<hr class="o-hr">`; break;
    case "image": inner = P.src
      ? `<div style="text-align:${P.align || "left"}"><img class="o-img o-img-${P.size || "m"}" src="${esc(P.src)}" alt="${esc(P.alt)}"></div>`
      : (mode === "edit" ? `<div class="o-img-ph">Bild oder Logo: rechts eine Datei auswählen</div>` : ""); break;
    case "spacer": inner = `<div style="height:${+P.h || 24}px"></div>`; break;
    case "section": {
      const ink = inkFor(P.bg);
      const st = P.bg && ink ? `background:${P.bg};color:${ink};--app-bg:${P.bg};--app-ink:${ink};` : `background:var(--app-soft);`;
      inner = `<div class="o-sec p-${P.pad || "m"} ${P.border ? "bordered" : ""}" style="${st}">${listHtml(b.children, "L" + b.id, app, mode)}</div>`; break;
    }
    case "columns": inner = `<div class="o-cols" style="--n:${b.cols.length}">${b.cols.map((c,i) => `<div class="o-stack">${listHtml(c, "L" + b.id + "_" + i, app, mode)}</div>`).join("")}</div>`; break;
    case "button": {
      const c = P.color || "var(--app-accent)", ink = P.color ? inkFor(P.color) : "var(--app-accent-ink)";
      const act = mode === "run" ? `data-action="run-ai" data-aktion="${esc(P.aktion || "alle")}"` : `tabindex="-1"`;
      inner = `<div class="o-btn-row" style="justify-content:${P.align === "center" ? "center" : P.align === "right" ? "flex-end" : "flex-start"}"><button type="button" class="o-btn ${P.stil === "outline" ? "outline" : ""}" style="--btn:${c};--btn-ink:${ink}" ${act} data-edit>${esc(P.text)}</button></div>`; break;
    }
    case "output": {
      const st = (app.steps || []).find(s => s.id === P.quelle);
      const body = mode === "edit" ? `<p class="o-muted">${st ? `Zeigt das Ergebnis von „${esc(st.name)}“.` : "Noch kein KI-Schritt gewählt."}</p>` : `<p class="o-muted">Das Ergebnis erscheint hier.</p>`;
      inner = `<div class="o-out ${P.stil === "plain" ? "" : "card"}" data-src="${esc(P.quelle)}"><div class="o-out-head"><span class="o-out-t">${esc(P.titel)}</span><span class="status" hidden></span></div><div class="o-out-body">${body}</div><div class="o-out-foot" hidden></div></div>`; break;
    }
    default: inner = BT[b.type]?.field ? fieldControl(b, mode) : "";
  }
  if(mode !== "edit") return inner;
  const sel = ed && ed.sel === b.id;
  const tag = BT[b.type].label + (BT[b.type].field ? ` · {{${P.key}}}` : "");
  let useB = "";
  if(BT[b.type].field){
    const u = stepsUsing(app, P.key);
    useB = `<span class="b-use ${u.length ? "" : "off"}">${u.length ? "→ KI-Schritt " + u.map(i => i + 1).join(", ") : "nicht an KI"}</span>`;
  }
  const tools = sel ? `<span class="b-tools"><button data-action="b-up" title="Nach oben" aria-label="Nach oben">↑</button><button data-action="b-down" title="Nach unten" aria-label="Nach unten">↓</button><button data-action="b-dup" title="Duplizieren" aria-label="Duplizieren">⧉</button><button data-action="b-del" title="Löschen" aria-label="Löschen">✕</button></span>` : "";
  return `<div class="b ${sel ? "sel" : ""}" data-bid="${b.id}" draggable="true"><span class="b-tag">${esc(tag)}</span>${tools}${useB}${inner}</div>`;
}

function fillExamples(app, root){

/* ================= Ausführen ================= */
function stepsFor(app, aktion){
  aktion = aktion || "alle";
  if(aktion === "alle") return app.steps.slice();
  if(aktion.startsWith("ab:")){ const i = app.steps.findIndex(s => s.id === aktion.slice(3)); return i < 0 ? [] : app.steps.slice(i); }
  return app.steps.filter(s => s.id === aktion);
}
function aktionLabel(app, aktion){
  if(!aktion || aktion === "alle") return "alle KI-Schritte";
  const id = aktion.startsWith("ab:") ? aktion.slice(3) : aktion, s = app.steps.find(x => x.id === id);
  return s ? (aktion.startsWith("ab:") ? "ab „" + s.name + "“" : "nur „" + s.name + "“") : "einen gelöschten Schritt";
}
function quellenOf(step){ return (step.quellen || []).filter(q => q && (q.url || q.titel)); }
function systemText(app, step){
  const q = quellenOf(step);
  return [`Du arbeitest in der Applikation „${app.name}“ eines internen KI-Hubs. Antworte auf Deutsch.`, step.rolle,
    step.wissen ? "Hintergrundwissen:\n" + step.wissen : "",
    q.length ? "Hinterlegte Wissensquellen:\n" + q.map(x => `- ${x.titel || x.url} (${QUELL_TYP[x.typ] || "Quelle"})${x.url ? ": " + x.url : ""}`).join("\n") : "",
    FORMAT_HINT[step.format] || FORMAT_HINT.markdown].filter(Boolean).join("\n\n");
}
function buildRequest(app, step, ctx, files){
  const inPrompt = new Set(varsIn(step.prompt));
  const used = new Set(varsIn(step.prompt + " " + (step.wissen || "")));
  let nachricht = fill(step.prompt, ctx);
  if(step.autoAll){
    const rest = fieldsOf(app).filter(b => !inPrompt.has(b.props.key.toLowerCase()));
    rest.forEach(b => used.add(b.props.key.toLowerCase()));
    if(rest.length) nachricht = (nachricht.trim() ? nachricht.trim() + "\n\n" : "") + "Eingaben:\n\n" +
      rest.map(b => `${b.props.label}:\n${ctx[b.props.key.toLowerCase()] ?? ""}`).join("\n\n");
  }
  const variablen = {};
  used.forEach(k => { const v = ctx[k]; variablen[k] = v === undefined ? null : String(v).length > 160 ? String(v).slice(0,160) + " …" : v; });
  const dateien = fieldsOf(app).filter(b => b.type === "file" && used.has(b.props.key.toLowerCase())).map(b => {
    const f = files?.[b.props.key];
    return {feld:b.props.key, uebergabe:b.props.uebergabe || "text", name:f?.name || null, typ:f?.type || null, groesse:f?.size ?? null};
  });
  return {
    applikation: app.name,
    applikationId: app.id || null,
    schritt: step.name,
    modell: step.modell || "default",
    ausgabeformat: step.format || "markdown",
    websuche: !!step.web,
    wissensquellen: quellenOf(step).map(q => ({typ:q.typ, titel:q.titel || "", url:q.url || ""})),
    dateien,
    system: systemText(app, {...step, wissen: fill(step.wissen, ctx)}),
    nachricht,
    variablen
  };
}
/* Dieselbe Anfrage, übersetzt für Microsoft 365 Copilot über Microsoft Graph */
function graphPreview(step, req){
  const parts = [];
  const refs = req.dateien.filter(d => d.uebergabe === "referenz");
  const files = quellenOf(step).filter(q => q.typ === "datei" && q.url).map(q => ({uri:q.url}));
  refs.forEach(d => files.push({uri:`https://<tenant>-my.sharepoint.com/personal/<benutzer>/Documents/KI-Hub/${d.name || "<" + d.feld + ">"}`}));
  if(refs.length) parts.push(`// 0) Hochgeladene Datei(en) nach OneDrive legen\nPUT https://graph.microsoft.com/v1.0/me/drive/root:/KI-Hub/<dateiname>:/content\n<Dateiinhalt>`);
  const sp = quellenOf(step).filter(q => q.typ === "sharepoint" && q.url);
  if(sp.length) parts.push(`// 1) Passende Inhalte aus SharePoint holen (Retrieval API)\nPOST https://graph.microsoft.com/v1.0/copilot/retrieval\n` +
    JSON.stringify({queryString:"<Suchbegriffe aus Aufgabe und Eingaben>", dataSource:"sharePoint", filterExpression:sp.map(q => `path:"${q.url}"`).join(" OR "), maximumNumberOfResults:10}, null, 2) +
    `\n// Die gefundenen Textauszüge werden der Nachricht als Hintergrundwissen vorangestellt.`);
  parts.unshift(`// Zentrale KI-Anbindung des KI-Hubs (Azure-Anwendung)\n// Token: MSAL mit Single Sign-on über das Windows-Konto, delegierte Graph-Berechtigungen,\n// zwischengespeichert und vor Ablauf (nach ca. 45 Minuten) erneuert.\n// Header bei jedem Aufruf: Authorization: Bearer <Token>`);
  parts.push(`// 2) Gespräch anlegen (einmal pro Durchlauf)\nPOST https://graph.microsoft.com/beta/copilot/conversations\n{}`);
  const body = {message:{text:req.system + "\n\n---\n\n" + req.nachricht}, locationHint:{timeZone:"Europe/Berlin"}, contextualResources:{}};
  if(files.length) body.contextualResources.files = files;
  body.contextualResources.webContext = {isWebEnabled:!!req.websuche};
  parts.push(`// 3) Nachricht senden. Antwort: der letzte Text in „messages“, der nicht die eigene Frage ist\nPOST https://graph.microsoft.com/beta/copilot/conversations/{conversationId}/chat\n` + JSON.stringify(body, null, 2));
  parts.push(`// Hinweise\n// - Die Modellwahl („${MODELL_LABEL[req.modell] || req.modell}“) hat bei Copilot keine Wirkung.\n// - Voraussetzungen: Microsoft-365-Copilot-Lizenz, Anmeldung über Entra ID, delegierte Berechtigungen.\n// - Endpunkte und Felder: Stand Mitte 2026. Vor der Umsetzung mit der aktuellen Microsoft-Graph-Dokumentation abgleichen.`);
  return parts.join("\n\n");
}
function collectVals(app, root, need){
  const vals = {}; let ok = true;
  fieldsOf(app).forEach(b => {
    const P = b.props, wrap = root.querySelector(`.o-field[data-key="${CSS.escape(P.key)}"]`);
    if(!wrap) return;
    let v = "";
    if(b.type === "radio") v = wrap.querySelector("input:checked")?.value || "";
    else if(b.type === "checkbox") v = wrap.querySelector("input")?.checked ? "ja" : "nein";
    else if(b.type === "file") v = rs.files[P.key]?.text || "";
    else v = (wrap.querySelector("#in-" + CSS.escape(P.key))?.value || "").trim();
    wrap.classList.remove("err"); wrap.querySelector(".o-err")?.remove();
    if(P.pflicht && (!need || need.has(P.key)) && (!v || (b.type === "checkbox" && v === "nein"))){
      ok = false; wrap.classList.add("err"); wrap.insertAdjacentHTML("beforeend", `<span class="o-err">Bitte ausfüllen.</span>`);
    }
    vals[P.key.toLowerCase()] = v || "(keine Angabe)";
  });
  if(!ok) root.querySelector(".o-field.err")?.scrollIntoView({block:"center", behavior:"smooth"});
  return ok ? vals : null;
}
function condOk(s, vals){
  const b = s.bedingung; if(!b || !b.feld) return true;
  let v = vals[b.feld.toLowerCase()]; if(v === "(keine Angabe)") v = "";
  v = String(v ?? "").trim().toLowerCase();
  const w = String(b.wert ?? "").trim().toLowerCase();
  switch(b.op){
    case "gefuellt": return !!v && v !== "nein";
    case "leer": return !v || v === "nein";
    case "ungleich": return v !== w;
    default: return v === w;
  }
}
function condText(app, s){
  const b = s.bedingung, f = fieldsOf(app).find(x => x.props.key === b.feld);
  return `„${f?.props.label || b.feld}“ ${BED_OP[b.op] || BED_OP.gleich}${["gefuellt","leer"].includes(b.op) ? "" : ` „${b.wert}“`}`;
}
function outputsFor(root, step){

/* Dateipakete (Format „dateien“) */
function cleanPath(p){
  return String(p || "").replace(/\\/g,"/").split("/").map(s => s.trim().replace(/[<>:"|?*\u0000-\u001f]/g,"_").replace(/^\.+$/,"_")).filter(Boolean).join("/").slice(0,240);
}
function parsePaket(text){
  const t = String(text || ""), a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a < 0 || b < a) return null;
  try{
    const o = JSON.parse(t.slice(a, b + 1));
    const dateien = (Array.isArray(o.dateien) ? o.dateien : []).map(f => ({pfad:cleanPath(f?.pfad), inhalt:String(f?.inhalt ?? "")})).filter(f => f.pfad).slice(0,200);
    return dateien.length ? {hinweis:String(o.hinweis || ""), dateien} : null;
  }catch{ return null; }
}
function treeText(paths){
  const root = {};
  paths.forEach(p => { let n = root; p.split("/").forEach(seg => { n = n[seg] = n[seg] || {}; }); });
  const lines = [];
  const rec = (n, pre) => {
    const ks = Object.keys(n);
    ks.forEach((k,i) => {
      const last = i === ks.length - 1, dir = Object.keys(n[k]).length > 0;
      lines.push(pre + (last ? "└── " : "├── ") + k + (dir ? "/" : ""));
      rec(n[k], pre + (last ? "    " : "│   "));
    });
  };
  rec(root, "");
  return lines.join("\n");
}
function renderPaket(p){
  return `${p.hinweis ? `<p>${esc(p.hinweis)}</p>` : ""}<p class="o-muted">${p.dateien.length} Dateien im Paket</p><pre class="prompt">${esc(treeText(p.dateien.map(f => f.pfad)))}</pre>` +

}
function paketName(app, p){
  const tops = new Set(p.dateien.map(f => f.pfad.split("/")[0]));
  return (tops.size === 1 && p.dateien.every(f => f.pfad.includes("/")) ? [...tops][0] : slug(app.name)) + ".zip";
}

/* Bibliotheken bei Bedarf laden (Excel, Word, PDF, ZIP) */
const libCache = {};
function loadLib(k){
  const [src, glob] = LIBS[k];
  if(window[glob]) return Promise.resolve(window[glob]);
  if(!libCache[k]) libCache[k] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = () => window[glob] ? res(window[glob]) : rej(new Error("lib"));
    s.onerror = () => { delete libCache[k]; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return libCache[k];
}
async function extractText(file){
  const n = file.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls)$/.test(n)){
    const X = await loadLib("xlsx");
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    return wb.SheetNames.map(sn => `## Tabellenblatt: ${sn}\n` + X.utils.sheet_to_csv(wb.Sheets[sn], {FS:";"})).join("\n\n");
  }
  if(/\.docx$/.test(n)){
    const M = await loadLib("mammoth");
    return (await M.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;
  }
  if(/\.pdf$/.test(n)){
    const P = await loadLib("pdf");
    P.GlobalWorkerOptions.workerSrc = LIBS.pdf[0].replace("pdf.min.js", "pdf.worker.min.js");
    const doc = await P.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const out = [];
    for(let i = 1; i <= Math.min(doc.numPages, 200); i++){ const tc = await (await doc.getPage(i)).getTextContent(); out.push(tc.items.map(it => it.str).join(" ")); }
    return out.join("\n\n");
  }
  if(/\.(doc|ppt|pptx|msg)$/.test(n)) throw new Error("format");
  return file.text();
}

/* Herunterladen */
let dlNs;
async function saveFile(name, data, btn){
  if(dlNs === undefined){ try{ dlNs = (await window.claude?.use?.("downloads")) ?? null; }catch{ dlNs = null; } }
  const old = btn.textContent;
  if(!dlNs){ btn.textContent = "Download hier nicht möglich"; setTimeout(() => { btn.textContent = old; }, 2400); return; }
  try{ await dlNs.save({filename:name, data}); btn.textContent = "Gespeichert"; }
  catch(e){ btn.textContent = e?.code === "declined" ? "Abgebrochen" : "Download nicht möglich"; }
  setTimeout(() => { btn.textContent = old; }, 2000);
}

function runApp(){ return view.name === "builder" ? ed?.app : findApp(view.id); }
async function runAi(btn){
  const app = runApp(); if(!app) return;
  if(rs.ctl){ rs.ctl.abort(); return; }
  const root = btn.closest(".app-frame");
  const steps = stepsFor(app, btn.dataset.aktion);
  if(!steps.length) return;
  const runIdx = new Set(steps.map(s => app.steps.indexOf(s)));
  const need = new Set(fieldsOf(app).filter(b => stepsUsing(app, b.props.key).some(i => runIdx.has(i))).map(b => b.props.key));
  const vals = collectVals(app, root, need); if(!vals) return;
  for(const s of steps){
    const i = app.steps.indexOf(s), used = varsIn(s.prompt + " " + (s.wissen || ""));
    const missing = app.steps.slice(0, i).find(p => !runIdx.has(app.steps.indexOf(p)) && !(p.key in rs.results) && used.includes(p.key.toLowerCase()));
    if(missing){
      setOut(outputsFor(root, s), "err", "wartet auf Ergebnis", `<p class="err-text">„${esc(s.name)}“ braucht das Ergebnis von „${esc(missing.name)}“. Starte zuerst den Button für „${esc(missing.name)}“.</p>`);
      return;
    }
  }
  const label = btn.textContent;
  btn.textContent = "Stoppen"; btn.classList.add("running");
  root.querySelectorAll('[data-action="run-ai"]').forEach(b => { if(b !== btn) b.disabled = true; });
  const ctl = rs.ctl = new AbortController();
  const ctx = {...vals, ...rs.results};
  for(const s of steps){
    const outs = outputsFor(root, s);
    if(!condOk(s, vals)){
      rs.results[s.key] = ""; ctx[s.key] = "";
      setOut(outs, "wait", "übersprungen", `<p class="o-muted">Übersprungen, weil die Bedingung nicht erfüllt ist: ${esc(condText(app, s))}.</p>`);
      continue;
    }
    const req = buildRequest(app, s, ctx, rs.files);
    rs.reqs[s.id] = req;
    setOut(outs, "run", "läuft", `<p class="o-muted">KI arbeitet …</p>`);
    let text = null;
    const show = t => s.format === "dateien" ? `<p class="o-muted">Dateipaket wird erstellt … (${t.length.toLocaleString("de-DE")} Zeichen)</p>` : renderResult(t, s.format);
    if(sampleFn && aiState !== "off"){
      const note = quellenOf(s).length ? "\n\nHinweis: Die hinterlegten Wissensquellen sind in dieser Testumgebung nicht abrufbar. Erfinde keine Inhalte daraus, sondern weise darauf hin, wo sie fehlen." : "";
      try{
        const r = await sampleFn(req.system + note + "\n\n---\n\n" + req.nachricht, {signal:ctl.signal, cache:false, modelTier:s.modell || "default",
          onText:({text}) => outs.forEach(o => { o.querySelector(".o-out-body").innerHTML = show(text); })});
        text = r.text;
        let html;
        if(s.format === "dateien"){
          const p = parsePaket(text);
          if(p){ rs.pakete[s.id] = p; html = renderPaket(p); }
          else html = `<p class="err-text">Die KI hat kein gültiges Dateipaket geliefert. Starte den Schritt erneut.</p><details><summary>Rohantwort</summary><pre class="prompt">${esc(text)}</pre></details>`;
        }else html = renderResult(text, s.format);
        setOut(outs, "done", "fertig", html + (r.truncated ? `<p class="o-muted">Die Antwort wurde gekürzt. Teil die Aufgabe auf mehrere Schritte auf.</p>` : ""));
      }catch(e){
        if(e?.code === "cancelled"){ setOut(outs, "wait", "gestoppt", e.text && s.format !== "dateien" ? renderResult(e.text, s.format) : ""); break; }
        if(OFF_CODES.includes(e?.code)){ aiState = "off"; setAiPill(); }
        else{ setOut(outs, "err", "Fehler", (e?.text && e.code !== "refused" && s.format !== "dateien" ? renderResult(e.text, s.format) : "") + `<p class="err-text">${esc(ERR_TEXT[e?.code] || "Die Verbindung zur KI ist abgebrochen. Starte erneut.")}</p>`); break; }
      }
    }
    if(text === null){
      text = `‹Ergebnis von ${s.name}›`;
      setOut(outs, "wait", "simuliert", `<p class="sim-note">Simulation: Diese Anfrage würde an die KI-Schnittstelle gehen.</p><pre class="prompt">${esc(JSON.stringify(req, null, 2))}</pre>`);
    }
    rs.results[s.key] = text; ctx[s.key] = text; rs.texts[s.id] = text;
    setFoot(outs, s);
  }
  if(rs.ctl === ctl) rs.ctl = null;
  btn.textContent = label; btn.classList.remove("running");
  root.querySelectorAll('[data-action="run-ai"]').forEach(b => b.disabled = false);
}

/* Verlauf: Rückgängig / Wiederholen */
let typingKey = null, typingAt = 0;
function snap(){
  if(!ed) return;
  ed.undo.push(JSON.stringify(ed.app));
  if(ed.undo.length > 80) ed.undo.shift();
  ed.redo = []; ed.dirty = true;
  updateUndoBtns();
}
function snapTyping(t){
  const now = Date.now(), k = t.id || t.dataset.p || t.dataset.s || t.dataset.ap;
  if(k !== typingKey || now - typingAt > 1500) snap();
  typingKey = k; typingAt = now;
}
function histMove(from, to){
  if(!ed || !ed[from].length) return;
  ed[to].push(JSON.stringify(ed.app));
  ed.app = JSON.parse(ed[from].pop());
  if(ed.sel && !locate(ed.app.blocks, ed.sel)) ed.sel = null;
  ed.dirty = true; typingKey = null;
  renderBuilder();
}
function updateUndoBtns(){
  const u = document.querySelector('[data-action="undo"]'), r = document.querySelector('[data-action="redo"]');
  if(u) u.disabled = !ed.undo.length;
  if(r) r.disabled = !ed.redo.length;
}

/* Bausteine verändern */
function cloneBlock(b){
  const c = clone(b);
  const re = x => { x.id = rid("b"); if(BT[x.type]?.field){ x.props.key = uniqueKey(slug(x.props.key), allKeys(ed.app)); } (x.children || []).forEach(re); (x.cols || []).forEach(col => col.forEach(re)); };
  re(c); return c;
}
function blockAction(a){
  const loc = ed.sel ? locate(ed.app.blocks, ed.sel) : null;
  if(!loc) return;
  snap();
  if(a === "b-del"){ loc.list.splice(loc.i,1); ed.sel = null; }
  if(a === "b-dup"){ const c = cloneBlock(loc.b); loc.list.splice(loc.i + 1, 0, c); ed.sel = c.id; }
  if(a === "b-up" && loc.i > 0){ [loc.list[loc.i-1], loc.list[loc.i]] = [loc.list[loc.i], loc.list[loc.i-1]]; }
  if(a === "b-down" && loc.i < loc.list.length - 1){ [loc.list[loc.i+1], loc.list[loc.i]] = [loc.list[loc.i], loc.list[loc.i+1]]; }
  renderCanvas(); renderInspector();
}
function addByClick(type){
  snap();
  const b = makeBlock(type, ed.app);
  let target = ed.app.blocks, idx = target.length;
  const loc = ed.sel ? locate(ed.app.blocks, ed.sel) : null;
  if(loc){
    if(loc.b.type === "section"){ target = loc.b.children; idx = target.length; }
    else if(loc.b.type === "columns"){ target = loc.b.cols[0]; idx = target.length; }
    else { target = loc.list; idx = loc.i + 1; }
  }
  target.splice(idx, 0, b);
  ed.sel = b.id; renderCanvas(); renderInspector();
  document.querySelector(`[data-bid="${b.id}"]`)?.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function setCols(b, n){
  n = +n;
  while(b.cols.length < n) b.cols.push([]);
  while(b.cols.length > n){ const extra = b.cols.pop(); b.cols[b.cols.length - 1].push(...extra); }
  b.props.count = n;
}

function appWarnings(app){
  const w = [];
  const fieldKeys = fieldsOf(app).map(b => b.props.key);
  const used = new Set();
  if(!String(app.name).trim()) w.push(["Gib der Applikation einen Namen.", false]);
  if(!app.steps.length) w.push(["Leg im KI-Ablauf mindestens einen KI-Schritt an.", false]);
  app.steps.forEach((s,i) => {
    const avail = new Set([...fieldKeys, ...app.steps.slice(0,i).map(x => x.key)]);
    for(const k of varsIn(s.prompt + " " + (s.wissen || ""))){ used.add(k); if(!avail.has(k)) w.push([`„${s.name}“ nutzt {{${k}}}. Diese Variable gibt es an dieser Stelle nicht.`, false]); }
    if(!String(s.prompt).trim()) w.push([`„${s.name}“ hat noch keinen Prompt.`, false]);
    if(s.bedingung?.feld && !fieldKeys.includes(s.bedingung.feld)) w.push([`Die Bedingung von „${s.name}“ verweist auf ein Feld, das es nicht mehr gibt.`, false]);
    if((s.quellen || []).some(q => !String(q.url || "").trim())) w.push([`„${s.name}“ hat eine Wissensquelle ohne Adresse.`, true]);
  });
  let hasBtn = false; const outSrc = new Set();
  walk(app.blocks, b => {
    if(b.type === "button"){ hasBtn = true; if(b.props.aktion !== "alle" && !stepsFor(app, b.props.aktion).length) w.push([`Der Button „${b.props.text}“ startet einen Schritt, den es nicht mehr gibt.`, false]); }
    if(b.type === "output"){ if(!app.steps.some(s => s.id === b.props.quelle)) w.push([`Das Ergebnis-Element „${b.props.titel}“ ist mit keinem KI-Schritt verbunden.`, false]); outSrc.add(b.props.quelle); }
    if((b.type === "select" || b.type === "radio") && !(b.props.optionen || []).length) w.push([`„${b.props.label}“ hat noch keine Optionen.`, false]);
  });
  if(app.steps.length && !hasBtn) w.push(["Auf der Oberfläche fehlt ein KI-Button, der den Ablauf startet.", false]);

  fieldsOf(app).forEach(b => { if(!stepsUsing(app, b.props.key).length) w.push([`Die Eingabe „${b.props.label}“ geht an keinen KI-Schritt.`, true]); });

}

/* Bild einlesen und auf höchstens 800 px Breite verkleinern (SVG bleibt unverändert) */
function loadImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const url = String(r.result);
      if(file.type === "image/svg+xml") return resolve(url);
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, 800 / img.naturalWidth);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL("image/webp", .85);
        if(!out.startsWith("data:image/webp")) out = c.toDataURL("image/png");
        resolve(out.length < url.length ? out : url);
      };
      img.src = url;
    };
    r.readAsDataURL(file);
  });
}

/* ================= KI-Assistent ================= */
const isHex = v => /^#[0-9a-f]{6}$/i.test(String(v || ""));
function sanitizeTheme(t, base){
  t = t && typeof t === "object" ? t : {};
  const b = {...DEFAULT_THEME, ...(base || {})};
  return {
    accent: t.accent === "" || isHex(t.accent) ? (t.accent ?? b.accent) : b.accent,
    bg: t.bg === "" || isHex(t.bg) ? (t.bg ?? b.bg) : b.bg,
    font: FONTS[t.font] ? t.font : b.font,
    radius: RADIUS[t.radius] ? t.radius : b.radius,
    width: WIDTH[t.width] ? t.width : b.width
  };
}
function coerceProp(k, v, d){
  if(typeof d === "boolean") return !!v;
  if(k === "color" || k === "bg") return v === "" || isHex(v) ? v : d;
  if(k === "optionen") return Array.isArray(v) ? v.map(x => String(x).slice(0,120)).filter(Boolean).slice(0,20) : d;
  if(ENUMS[k]){ const n = typeof d === "number" ? Number(v) : v; return ENUMS[k].includes(n) ? n : d; }
  if(typeof d === "number") return Number.isFinite(Number(v)) ? Number(v) : d;
  return String(v ?? "").slice(0, 4000);
}
/* Prüft eine von der KI (oder per Import) gelieferte App und bringt sie in ein sauberes Format */
function sanitizeApp(raw, base){
  raw = raw && typeof raw === "object" ? raw : {};
  const app = clone(base);
  if(typeof raw.name === "string" && raw.name.trim()) app.name = raw.name.trim().slice(0,60);
  if(typeof raw.bereich === "string" && raw.bereich.trim()) app.bereich = raw.bereich.trim().slice(0,40);
  if(typeof raw.beschreibung === "string") app.beschreibung = raw.beschreibung.slice(0,300);
  app.theme = sanitizeTheme(raw.theme, base.theme);
  const ids = new Set(), keys = new Set(), renames = [], stepMap = new Map();
  const cleanId = (id, p) => { id = String(id || "").replace(/[^A-Za-z0-9_-]/g,"").slice(0,24); if(!id || ids.has(id)) id = rid(p); ids.add(id); return id; };
  const stepsIn = Array.isArray(raw.steps) ? raw.steps : base.steps;
  app.steps = stepsIn.slice(0,8).filter(s => s && typeof s === "object").map((s,i) => {
    const id = cleanId(s.id, "s"); stepMap.set(String(s.id), id);
    const key = uniqueKey(slug(s.key || "schritt" + (i+1)), keys); keys.add(key);
    if(s.key && s.key !== key) renames.push([String(s.key), key]);
    return {id, name:String(s.name || "KI-Schritt " + (i+1)).slice(0,80), key,
      rolle:String(s.rolle || "").slice(0,4000), wissen:String(s.wissen || "").slice(0,20000), prompt:String(s.prompt || "").slice(0,8000),
      modell:MODELL_LABEL[s.modell] ? s.modell : "default", format:FORMAT_LABEL[s.format] ? s.format : "markdown", autoAll:!!s.autoAll,
      web:!!s.web,
      quellen:(Array.isArray(s.quellen) ? s.quellen : []).slice(0,20).filter(q => q && typeof q === "object").map(q => ({typ:QUELL_TYP[q.typ] ? q.typ : "sharepoint", titel:String(q.titel || "").slice(0,120), url:String(q.url || "").slice(0,800)})),

  });
  const empty = {blocks:[], steps:[]};
  function sb(b, depth){
    if(!b || typeof b !== "object" || !BT[b.type] || depth > 5) return null;
    const def = makeBlock(b.type, empty);

    const p = b.props && typeof b.props === "object" ? b.props : {};
    for(const k of Object.keys(def.props)) if(k in p && k !== "key" && k !== "keyAuto") nb.props[k] = coerceProp(k, p[k], def.props[k]);
    if(BT[b.type].field){

function fixRefs(app, stepMap){

    }
    if(b.type === "output"){
      if(stepMap?.has(b.props.quelle)) b.props.quelle = stepMap.get(b.props.quelle);

}
function applyScope(next, base, scope){
  if(scope === "ui"){ next.steps = clone(base.steps); fixRefs(next); return next; }
  if(scope === "design"){
    const out = clone(base); out.theme = next.theme;
    const map = new Map(); walk(next.blocks, b => map.set(b.id, b));
    walk(out.blocks, b => { const n = map.get(b.id); if(!n || n.type !== b.type) return; VISUAL.forEach(k => { if(k in b.props && k in n.props) b.props[k] = n.props[k]; }); });
    return out;
  }

}
function assistPrompt(app, wish, scope){
  const scopeRule = scope === "ui" ? "Ändere nur Oberfläche und Design (blocks, theme). Gib steps exakt unverändert zurück."

    : "Du darfst Oberfläche, Design und KI-Ablauf ändern. Ist die Applikation noch ein leerer Entwurf, baue sie nach dem Wunsch komplett neu auf.";
  return `Du bist der KI-Assistent eines No-Code-Baukastens für KI-Applikationen in einem internen Firmenportal. Du änderst die Definition einer Applikation nach dem Wunsch der Person.

## Aufbau einer Applikation

## Blocktypen und ihre props
- section: bg ("#RRGGBB" oder ""), pad s|m|l, border bool
- columns: count 2|3
- spacer: h 12|24|48
- divider: keine
- heading: text, level 1|2|3, align left|center|right, color
- text: text, size s|m|l, align, color
- callout: text, tone info|warn|ok
- image: src (nie selbst setzen, neue Bilder mit src ""), alt, size s|m|l|full, align

- output: titel, quelle (id eines Schritts), stil card|plain

## Regeln
- Behalte die ids bestehender Blöcke und Schritte bei. Neue Blöcke und Schritte bekommen neue kurze ids wie "n1", "n2".

- Gute Gestaltung: klare Überschrift, kurze Erklärung, zusammengehörige Eingaben in einem Bereich, Ergebnisse gut sichtbar. Farben nur als #RRGGBB, ruhig und geschäftlich.

${JSON.stringify(app)}

"""${wish}"""

Antworte nur mit einem JSON-Objekt dieser Form:
{"zusammenfassung": "ein bis zwei Sätze, was du geändert hast", "app": {"name": "...", "bereich": "...", "beschreibung": "...", "theme": {...}, "blocks": [...], "steps": [...]}}`;

async function aiAssist(){
  if(ed.aiCtl){ ed.aiCtl.abort(); return; }
  const ta = document.getElementById("ai-brief"), msg = document.getElementById("ai-msg"), btn = document.querySelector('[data-action="ai-apply"]');
  const wish = ta.value.trim(); ed.brief = ta.value;
  if(!wish){ msg.textContent = "Beschreib zuerst, was entstehen oder sich ändern soll."; ta.focus(); return; }
  if(!sampleFn || aiState === "off"){ msg.textContent = "In dieser Ansicht ist keine KI verfügbar. Öffne den Hub über claude.ai."; return; }
  const imgs = new Map();
  const ctxApp = clone({name:ed.app.name, bereich:ed.app.bereich, beschreibung:ed.app.beschreibung, theme:ed.app.theme, blocks:ed.app.blocks, steps:ed.app.steps});
  walk(ctxApp.blocks, b => {
    if(b.type === "image"){ imgs.set(b.id, b.props.src); b.props.src = b.props.src ? "[bild]" : ""; }
    if(BT[b.type]?.field) delete b.props.keyAuto;
  });
  const base = ed.app, scope = ed.aiScope, baseJson = JSON.stringify(ed.app);
  const ctl = ed.aiCtl = new AbortController();
  btn.textContent = "Abbrechen";
  msg.textContent = "Die KI baut um. Das dauert meist 30 bis 90 Sekunden …";
  try{
    const res = await sampleFn.json(assistPrompt(ctxApp, wish, scope), {signal:ctl.signal, modelTier:"default"});
    if(!res || typeof res !== "object" || !res.app) throw {code:"invalid_json"};
    const next = applyScope(sanitizeApp(res.app, base), base, scope);
    walk(next.blocks, b => { if(b.type === "image") b.props.src = imgs.get(b.id) || ""; });
    if(!ed || ed.aiCtl !== ctl) return;         // Baukasten verlassen
    ed.aiCtl = null;
    if(JSON.stringify(ed.app) !== baseJson){    // währenddessen weitergearbeitet: nichts überschreiben
      const b2 = document.querySelector('[data-action="ai-apply"]'); if(b2) b2.textContent = "Umsetzen";
      const m2 = document.getElementById("ai-msg"); if(m2) m2.textContent = "Du hast währenddessen weitergearbeitet. Der Vorschlag wurde nicht übernommen, schick den Wunsch noch einmal.";
      return;
    }
    snap();
    ed.app = next; ed.sel = null; ed.brief = "";
    ed.reqStep = next.steps[0]?.id || "";
    ed.aiLog.unshift({prompt:wish, summary:String(res.zusammenfassung || "Änderungen übernommen.").slice(0,300)});
    renderBuilder();
  }catch(e){
    if(!ed) return;
    ed.aiCtl = null;
    const b2 = document.querySelector('[data-action="ai-apply"]'), m2 = document.getElementById("ai-msg");
    if(b2) b2.textContent = "Umsetzen";
    if(!m2) return;
    if(e?.code === "cancelled") m2.textContent = "Abgebrochen. Nichts wurde geändert.";
    else if(OFF_CODES.includes(e?.code)){ aiState = "off"; setAiPill(); m2.textContent = "Die KI ist in dieser Ansicht nicht freigegeben."; }
    else m2.textContent = e?.code === "invalid_json" ? "Die Antwort der KI war unvollständig. Versuch es noch einmal oder formuliere den Wunsch kürzer." : (ERR_TEXT[e?.code] || "Das Umbauen ist fehlgeschlagen. Versuch es noch einmal.");
  }
}

async function saveApp(){
  const msg = document.getElementById("save-msg");
  const hard = appWarnings(ed.app).filter(([,soft]) => !soft);
  if(hard.length){ msg.className = "save-msg bad"; msg.textContent = hard[0][0] + (hard.length > 1 ? ` (und ${hard.length - 1} weitere Punkte im KI-Ablauf)` : ""); return; }
  const def = clone(ed.app);
  delete def._src;
  def.id = def.id || "app-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  def.v = 2; def.typ = "baukasten"; def.geaendert = new Date().toISOString();
  def.version = (Number(def.version) || 0) + 1;
  msg.className = "save-msg"; msg.textContent = "Wird gespeichert …";
  const where = await persist(def);
  if(where === "none"){ msg.className = "save-msg bad"; msg.textContent = "Speichern ist in dieser Ansicht nicht möglich."; return; }
  ed = null;
  go({name:"app", id:def.id});
}

    const s = ed.app.steps[+srow.dataset.i];
    snapTyping(t);
    s[t.dataset.s] = t.type === "checkbox" ? t.checked : t.value;
    if(t.dataset.s === "name"){ const fl = document.querySelectorAll(".flowline span:not(.k)")[+srow.dataset.i]; if(fl) fl.textContent = `${+srow.dataset.i + 1} · ${t.value}`; }
    renderKiSide();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.matches?.('input[type="file"][data-file]')){
    const f = t.files?.[0], key = t.dataset.file, info = document.getElementById("fi-" + key);
    if(!f){ delete rs.files[key]; if(info) info.textContent = ""; return; }
    if(info) info.textContent = `${f.name} wird gelesen …`;
    extractText(f).then(txt => {
      txt = String(txt || "");
      rs.files[key] = {name:f.name, size:f.size, type:f.type || f.name.split(".").pop(), text:txt.slice(0, 60000)};
      if(info) info.textContent = txt.trim() ? `${f.name} gelesen (${Math.min(txt.length, 60000).toLocaleString("de-DE")} Zeichen${txt.length > 60000 ? ", gekürzt" : ""})` : `${f.name} enthält keinen lesbaren Text (z. B. ein eingescanntes PDF).`;
    }).catch(err => {
      delete rs.files[key];
      if(info) info.textContent = err?.message === "format" ? "Dieses Format kann der Prototyp nicht lesen. Speichere die Datei als .docx, .xlsx, .pdf, .csv oder .txt." : "Die Datei konnte nicht gelesen werden.";
    });
    return;
  }
  if(!ed || view.name !== "builder") return;
  if(t.dataset.img){
    const f = t.files?.[0], b = selBlock(), m = document.getElementById("img-msg");
    if(!f || !b) return;
    m.textContent = "Bild wird verarbeitet …";
    loadImage(f).then(src => {
      if(src.length > 200000){ m.textContent = "Das Bild ist auch verkleinert noch zu groß. Nutze ein kleineres Bild oder ein Logo als PNG/SVG."; return; }
      snap(); b.props.src = src;
      if(!b.props.alt) b.props.alt = f.name.replace(/\.[^.]+$/, "");
      renderCanvas(); renderInspector();
    }).catch(() => { m.textContent = "Die Datei konnte nicht als Bild gelesen werden."; });
    return;
  }
  if(t.dataset.p === "key" && t.closest("#insp")){
    const b = selBlock(); if(!b) return;
    snap();
    const nk = uniqueKey(slug(t.value), allKeys(ed.app, b));
    if(nk !== b.props.key) renameRefs(ed.app, b.props.key, nk);
    b.props.key = nk; b.props.keyAuto = false; t.value = nk;
    renderCanvas(); renderInspector(); return;
  }
  const srow = t.closest(".srow[data-sid]");
  if(srow && t.dataset.s === "key"){
    const s = ed.app.steps[+srow.dataset.i];
    snap();
    const nk = uniqueKey(slug(t.value), allKeys(ed.app, s));
    if(nk !== s.key) renameRefs(ed.app, s.key, nk);
    s.key = nk; t.value = nk;
    document.querySelectorAll('.srow textarea[data-s="prompt"]').forEach((ta, j) => { if(ta.value !== ed.app.steps[j].prompt) ta.value = ed.app.steps[j].prompt; });
    refreshVarChips(); renderKiSide();
  }
});
document.addEventListener("keydown", e => {
  if(!ed || view.name !== "builder" || ed.preview) return;
  if(e.target.closest("input,textarea,select,[contenteditable]")) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? histMove("redo","undo") : histMove("undo","redo"); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){ e.preventDefault(); histMove("redo","undo"); return; }
  if(ed.tab !== "ui" || !ed.sel) return;
  if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); blockAction("b-del"); }
  if(e.key === "Escape"){ ed.sel = null; renderCanvas(); renderInspector(); }
});

/* Direkt auf der Fläche bearbeiten */
document.addEventListener("dblclick", e => {
  const b = e.target.closest?.("#canvas .b"); if(!b) return;
  const target = [...b.querySelectorAll("[data-edit]")].find(x => x.closest(".b") === b);
  if(!target) return;
  const loc = locate(ed.app.blocks, b.dataset.bid); if(!loc) return;
  b.draggable = false;
  target.style.pointerEvents = "auto";
  try{ target.contentEditable = "plaintext-only"; }catch{ target.contentEditable = "true"; }
  if(target.contentEditable !== "plaintext-only") target.contentEditable = "true";
  target.focus();
  const r = document.createRange(); r.selectNodeContents(target); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const single = ["heading","button"].includes(loc.b.type);
  const onKey = ev => { if(ev.key === "Enter" && (single || !ev.shiftKey) && single){ ev.preventDefault(); target.blur(); } if(ev.key === "Escape") target.blur(); };
  target.addEventListener("keydown", onKey);
  target.addEventListener("blur", () => {
    const txt = target.innerText.replace(/\n{3,}/g,"\n\n").trim();
    if(txt && txt !== loc.b.props.text){ snap(); loc.b.props.text = txt; }
    ed.sel = loc.b.id; renderCanvas(); renderInspector();
  }, {once:true});
});

/* Ziehen und Ablegen */
function clearPh(){ ph?.remove(); dropAt = null; }
document.addEventListener("dragstart", e => {
  const p = e.target.closest?.("[data-ptype]");
  if(p){ drag = {kind:"new", type:p.dataset.ptype}; e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", p.dataset.ptype); return; }
  const b = e.target.closest?.("#canvas .b");
  if(b){ drag = {kind:"move", id:b.dataset.bid, el:b}; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", b.dataset.bid); requestAnimationFrame(() => b.classList.add("dragging")); }
});
document.addEventListener("dragover", e => {
  if(!drag) return;
  const list = e.target.closest?.("#canvas [data-list]");
  if(!list || (drag.kind === "move" && drag.el.contains(list))){ clearPh(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = drag.kind === "new" ? "copy" : "move";
  const kids = [...list.children].filter(c => c.classList.contains("b") && c !== drag.el);
  let before = null;
  for(const k of kids){ const r = k.getBoundingClientRect(); if(e.clientY < r.top + r.height / 2){ before = k; break; } }
  if(!ph){ ph = document.createElement("div"); ph.className = "drop-ph"; }
  if(ph.parentNode !== list || ph.nextSibling !== before) list.insertBefore(ph, before);
  dropAt = {listId:list.dataset.list, beforeId:before?.dataset.bid || null};
});
document.addEventListener("drop", e => {
  if(!drag || !dropAt) return;
  e.preventDefault();
  const target = reg.get(dropAt.listId);
  if(target){
    snap();
    let b;
    if(drag.kind === "new") b = makeBlock(drag.type, ed.app);
    else { const loc = locate(ed.app.blocks, drag.id); if(loc){ b = loc.b; loc.list.splice(loc.i, 1); } }
    if(b){
      let idx = dropAt.beforeId ? target.findIndex(x => x.id === dropAt.beforeId) : -1;
      if(idx < 0) idx = target.length;
      target.splice(idx, 0, b);
      ed.sel = b.id;
    }
  }
  clearPh(); drag = null;
  renderCanvas(); renderInspector();
});
document.addEventListener("dragend", () => {
  if(drag?.el) drag.el.classList.remove("dragging");
  clearPh(); drag = null;
});

go({name:"start"});
</script>
